# 控制系统参数文件
# 运动控制参数
motion_control:
  max_linear_speed: 2.0  # 米/秒
  max_angular_speed: 2.0  # 弧度/秒
  max_linear_acceleration: 1.0  # 米/秒²
  max_angular_acceleration: 1.0  # 弧度/秒²
  odometry_frame: "odom"
  base_frame: "base_link"
# 路径规划参数
path_planning:
  grid_resolution: 0.05  # 米/像素
  inflation_radius: 0.2   # 米
  planner_frequency: 10.0  # Hz
# PID控制器参数
pid_controllers:
  linear_velocity:
    kp: 1.0
    ki: 0.1
    kd: 0.05
    
  angular_velocity:
    kp: 2.0
    ki: 0.2
    kd: 0.1
    
  depth_control:
    kp: 0.5
    ki: 0.05
    kd: 0.1
# 安全参数
safety_params:
  emergency_stop_distance: 0.5  # 米
  obstacle_detection_distance: 1.0  # 米
  max_tilt_angle: 30.0  # 度
  battery_low_threshold: 20.0  # %
  motor_temp_threshold: 60.0  # 摄氏度
# 割草参数
mowing_params:
  cutting_width: 0.4  # 米
  cutting_speed: 0.5  # 米/秒
  overlap_percentage: 10  # %
  pattern: "back_and_forth"  # 或 "spiral"
